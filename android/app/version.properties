# Checked-in Android version numbers.
#
# CalVer + a same-day release sequence:
#   versionName = YYYY.MM.DD.<release-number>
#   versionCode = a monotonically increasing integer (8, 9, 10, ...)
#
# Example: versionName 2026.10.27.1, versionCode 8
#
# versionCode must increase for every Play/F-Droid upload and can never be
# reused for an application ID. Bump the release number for a second build on
# the same day, then update the literal defaults in build.gradle.kts
# (fdroidserver's checkupdates parser reads those):
#   VERSION_CODE=11
#   VERSION_NAME=2026.10.27.4
VERSION_CODE=11
VERSION_NAME=2026.10.27.4
