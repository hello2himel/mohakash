# Checked-in Android version numbers.
#
# versionCode must increase for every Play/F-Droid upload and can never be
# reused for an application ID. versionName is the human-readable release.
#
# Bump both before tagging a release:
#   VERSION_CODE=3
#   VERSION_NAME=1.0.2
VERSION_CODE=5
VERSION_NAME=1.0.4
