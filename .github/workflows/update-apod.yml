name: Update APOD data

# The schedule runs twice a day.  GitHub delays scheduled workflows, so the
# exact execution time is never guaranteed.
on:
  schedule:
    - cron: "17 7,13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: sync
        options:
          - sync
          - backfill
          - build
          - validate
      start_year:
        description: "First year to backfill (backfill mode only)"
        type: string
        default: ""
      end_year:
        description: "Last year to backfill (backfill mode only)"
        type: string
        default: ""
      refresh:
        description: "Re-fetch records that are already stored"
        type: boolean
        default: false
      force_deploy:
        description: "Publish to GitHub Pages even when the data did not change"
        type: boolean
        default: false

# Only one synchronisation may run at a time and an older run may never
# overwrite a newer archive.
concurrency:
  group: apod-data-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # commit the refreshed data
  pages: write      # publish the public API artifact
  id-token: write   # required by actions/deploy-pages

env:
  PYTHON_VERSION: "3.12"

jobs:
  update:
    name: Fetch, validate, publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # The data commit needs the full history to be pushed back.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt

      - name: Run the pipeline
        id: pipeline
        env:
          MODE: ${{ inputs.mode || 'sync' }}
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          set -euo pipefail
          case "$MODE" in
            sync)
              python scripts/sync_apod.py sync
              ;;
            backfill)
              ARGS=(backfill)
              if [ -n "$START_YEAR" ]; then ARGS+=(--start-year "$START_YEAR"); fi
              if [ -n "$END_YEAR" ]; then ARGS+=(--end-year "$END_YEAR"); fi
              if [ "$REFRESH" = "true" ]; then ARGS+=(--refresh); fi
              python scripts/sync_apod.py "${ARGS[@]}"
              ;;
            build)
              python scripts/sync_apod.py build
              ;;
            validate)
              python scripts/sync_apod.py validate
              ;;
            *)
              echo "unknown mode: $MODE" >&2
              exit 1
              ;;
          esac

      # A failed fetch must never publish an empty or broken archive.  The
      # pipeline keeps the previous data, so validation runs against what is
      # actually going to be published.
      - name: Validate the archive and the generated documents
        run: python scripts/sync_apod.py validate

      - name: Assemble the public API artifact
        run: python scripts/sync_apod.py assemble-site --site-root api-site

      - name: Fail when the artifact would be empty
        run: |
          set -euo pipefail
          test -f api-site/api/v1/latest.json
          test -f api-site/api/v1/archive-index.json
          test -f api-site/api/v1/status.json
          test -f api-site/feed.xml
          test -f api-site/.nojekyll

      - name: Commit the refreshed data
        id: commit
        run: |
          set -euo pipefail
          git config user.name "mohakash-bot"
          git config user.email "mohakash-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes, nothing to commit."
          else
            git commit -m "chore(apod): refresh APOD data [skip netlify]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: api-site

      - name: Publish to GitHub Pages
        if: steps.commit.outputs.changed == 'true' || inputs.force_deploy == true
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          {
            echo "### APOD data"
            echo ""
            echo "- data changed: ${{ steps.commit.outputs.changed }}"
            echo "- record count: $(python scripts/sync_apod.py status | python -c 'import json,sys; print(json.load(sys.stdin)["records"])')"
          } >> "$GITHUB_STEP_SUMMARY"
