name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt
      - name: Run the pipeline tests
        run: python -m pytest scripts/tests -q
      - name: Check that netlify.toml matches config/site.json
        run: python scripts/render_netlify_config.py --check
      - name: Validate the archive
        run: python scripts/sync_apod.py validate

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the site configuration
        run: npm run generate:site
      - name: Check that the generated configuration is up to date
        run: git diff --exit-code -- src/lib/site.generated.ts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Keep Android debug signatures stable between CI runs so a newer
          # APK can be installed over the previous one. Forks without the
          # secret fall back to Gradle's generated debug key.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: android
      - name: Build the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mohakash-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Latest Android release
    needs: android
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mohakash-debug-apk
          path: release
      - name: Publish the latest APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv release/*.apk release/mohakash.apk
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts | head -n1)
          if [ -z "$version" ]; then
            echo "Could not read versionName from android/app/build.gradle.kts" >&2
            exit 1
          fi
          tag="v${version}"
          notes=$(printf '%s\n' \
            "Automated Android build of mohakash from the latest main branch." \
            "" \
            "- Version: ${version}" \
            "- Commit: ${GITHUB_SHA}" \
            "- Minimum Android: 7.0 (API 24)" \
            "- Debug-signed APK for direct installation; this is not a Play Store release." \
            "- Includes the live wallpaper service and the brand launcher icon." \
            "" \
            "This asset is updated by CI on every push to main.")
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/mohakash.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --notes "$notes" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/mohakash.apk \
              --title "mohakash ${tag} — Android app" \
              --notes "$notes" \
              --target "$GITHUB_SHA" \
              --latest \
              --repo "$GITHUB_REPOSITORY"
          fi
