name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data:
    name: Data pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r scripts/requirements.txt
      - name: Run the pipeline tests
        run: python -m pytest scripts/tests -q
      - name: Check that netlify.toml matches config/site.json
        run: python scripts/render_netlify_config.py --check
      - name: Validate the archive
        run: python scripts/sync_apod.py validate

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate the site configuration
        run: npm run generate:site
      - name: Check that the generated configuration is up to date
        run: git diff --exit-code -- src/lib/site.generated.ts
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  android:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          # Keep Android debug signatures stable between CI runs so a newer
          # APK can be installed over the previous one. Forks without the
          # secret fall back to Gradle's generated debug key.
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mohakash-debug.keystore"
            chmod 600 "$RUNNER_TEMP/mohakash-debug.keystore"
            echo "stable debug keystore restored ($(wc -c < "$RUNNER_TEMP/mohakash-debug.keystore") bytes)"
          else
            echo "no debug keystore secret; Gradle will generate one"
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
        working-directory: android
      - name: Build the debug APK
        env:
          ANDROID_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/mohakash-debug.keystore
        run: |
          if [ ! -f "$ANDROID_DEBUG_KEYSTORE_PATH" ]; then
            unset ANDROID_DEBUG_KEYSTORE_PATH
          fi
          ./gradlew --no-daemon :app:assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: mohakash-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

