<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200, initial-scale=1">
<title>mohakash — social / OG 1200×630</title>
<!-- Optional campaign cut. Same grid, type and crop logic, opened up for 1.91:1. -->
<style>
@font-face{font-family:"Newsreader";src:url("assets/fonts/newsreader_medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:block}
@font-face{font-family:"Inter";src:url("assets/fonts/inter_regular.ttf") format("truetype");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"Inter";src:url("assets/fonts/inter_medium.ttf") format("truetype");font-weight:500;font-style:normal;font-display:block}
:root{--ink:#0B0D12;--starlight:#F4F6FF;--glow:#8FA5FF;--dust:#8A93B2;--serif:"Newsreader",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05070B;overflow:hidden}
.stage{position:relative;width:1200px;height:630px;overflow:hidden;background:var(--ink);isolation:isolate;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
.bg{position:absolute;inset:0;background:
  radial-gradient(115% 125% at 18% 46%, rgba(11,13,18,0) 32%, rgba(4,6,10,.64) 100%),
  linear-gradient(100deg,#07090E 0%,#0B0D12 44%,#0B1020 100%)}
.ambient{position:absolute;z-index:1;left:300px;top:-90px;width:1000px;height:810px;
  background:url("assets/ambient.png") center/cover no-repeat;opacity:.30;
  -webkit-mask-image:linear-gradient(90deg,transparent 8%,rgba(0,0,0,.35) 38%,#000 72%);
          mask-image:linear-gradient(90deg,transparent 8%,rgba(0,0,0,.35) 38%,#000 72%)}
.aura{position:absolute;right:-180px;top:-210px;width:1040px;height:1040px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(79,107,255,.17),rgba(79,107,255,.055) 54%,rgba(79,107,255,0) 72%);filter:blur(26px)}
.aura-b{position:absolute;left:-160px;bottom:-400px;width:1060px;height:760px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(79,107,255,.15),rgba(79,107,255,.03) 55%,rgba(79,107,255,0) 74%);filter:blur(34px)}
.orbit{position:absolute;inset:0;z-index:1;pointer-events:none}
.stars{position:absolute;inset:0}
.star{position:absolute;border-radius:50%;background:#DDE5FF;box-shadow:0 0 6px rgba(221,229,255,.45)}
.star.b{background:var(--glow);box-shadow:0 0 9px rgba(143,165,255,.5)}
.grain{position:absolute;inset:0;z-index:8;background-image:url("assets/grain.png");background-size:160px 160px;opacity:.045;mix-blend-mode:overlay;pointer-events:none}
.screen{position:absolute;left:720px;top:0;width:480px;height:630px;overflow:hidden;background:#07090E;box-shadow:-52px 0 90px -50px rgba(0,0,0,.95);z-index:3}
.shot{position:absolute;left:0;top:-436.7px;width:480px;height:auto;display:block}
.screen-edge{position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,14,.55) 0,rgba(7,9,14,0) 18px);box-shadow:inset 1px 0 0 rgba(143,165,255,.20)}
.copy{position:absolute;left:128px;top:157px;width:430px;z-index:5}
h1{font-family:var(--serif);font-weight:500;font-size:74px;line-height:.96;letter-spacing:-.012em;color:var(--starlight)}
h1 .period{color:var(--glow)}
.rule{width:52px;height:1px;margin-top:28px;background:linear-gradient(90deg,rgba(143,165,255,.72),rgba(143,165,255,.08))}
.sub{margin-top:20px;font-family:var(--sans);font-weight:400;font-size:20px;line-height:1.5;letter-spacing:-.004em;color:#BAC3DA;white-space:nowrap}
.micro{margin-top:15px;font-family:var(--sans);font-weight:500;font-size:15px;line-height:1;letter-spacing:.12em;text-transform:uppercase;color:rgba(138,147,178,.88)}
.micro .sep{color:rgba(143,165,255,.55);padding:0 .35em}
</style>
</head>
<body>
<main class="stage" role="img" aria-label="mohakash: The sky, on your home screen. A new astronomy wallpaper every day. The app showing the M42 nebula, its credit and a Set wallpaper action.">
  <div class="bg"></div>
  <div class="ambient" aria-hidden="true"></div>
  <div class="aura" aria-hidden="true"></div>
  <div class="aura-b" aria-hidden="true"></div>
  <svg class="orbit" width="1200" height="630" viewBox="0 0 1200 630" aria-hidden="true">
    <circle cx="900" cy="900" r="760" fill="none" stroke="#8FA5FF" stroke-opacity="0.10" stroke-width="1"/>
    <circle cx="650" cy="182" r="12" fill="url(#orbGlow)"/>
    <circle cx="650" cy="182" r="2.9" fill="#CBD7FF"/>
    <defs><radialGradient id="orbGlow">
      <stop offset="0" stop-color="#8FA5FF" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#8FA5FF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8FA5FF" stop-opacity="0"/>
    </radialGradient></defs>
  </svg>
  <div class="stars" aria-hidden="true">
    <i class="star" style="left:72px;top:104px;width:1px;height:1px;opacity:.55"></i>
    <i class="star" style="left:104px;top:392px;width:1.5px;height:1.5px;opacity:.34"></i>
    <i class="star b" style="left:66px;top:546px;width:1.5px;height:1.5px;opacity:.30"></i>
    <i class="star" style="left:570px;top:116px;width:1.5px;height:1.5px;opacity:.46"></i>
    <i class="star" style="left:612px;top:232px;width:1px;height:1px;opacity:.32"></i>
    <i class="star b" style="left:668px;top:428px;width:1px;height:1px;opacity:.30"></i>
    <i class="star" style="left:700px;top:150px;width:2px;height:2px;opacity:.28"></i>
    <i class="star" style="left:646px;top:566px;width:1px;height:1px;opacity:.34"></i>
    <i class="star" style="left:424px;top:592px;width:1px;height:1px;opacity:.22"></i>
    <i class="star" style="left:280px;top:50px;width:1px;height:1px;opacity:.38"></i>
    <i class="star" style="left:474px;top:72px;width:1px;height:1px;opacity:.28"></i>
    <i class="star b" style="left:700px;top:540px;width:1.5px;height:1.5px;opacity:.22"></i>
  </div>
  <div class="screen" aria-hidden="true">
    <img class="shot" src="assets/app-feed.png" alt="">
    <div class="screen-edge"></div>
  </div>
  <div class="grain" aria-hidden="true"></div>
  <div class="copy">
    <h1>The sky,<br>on your<br>home screen<span class="period">.</span></h1>
    <div class="rule"></div>
    <p class="sub">A new astronomy wallpaper every day.</p>
    <p class="micro">Open source <span class="sep">·</span> No ads</p>
  </div>
</main>
</body>
</html>
